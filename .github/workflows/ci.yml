name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      ROBOT_VERSION: v1.9.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Cache ROBOT
        id: robot-cache
        uses: actions/cache@v4
        with:
          path: robot.jar
          key: robot-${{ env.ROBOT_VERSION }}
      - name: Download ROBOT
        if: steps.robot-cache.outputs.cache-hit != 'true'
        run: curl -fsSL -o robot.jar "https://github.com/ontodev/robot/releases/download/${ROBOT_VERSION}/robot.jar"
      - name: "ontology/: Turtle parses"
        working-directory: ontology
        run: python -m pytest -q tests/test_ontology.py
      - name: "ontology/: OWL 2 DL profile, HermiT reasoning (no unsatisfiable classes, consistent), ROBOT report"
        working-directory: ontology
        run: ROBOT_JAR="$GITHUB_WORKSPACE/robot.jar" scripts/reason.sh
      - name: "ontology/: SHACL, SPARQL competency queries, worked-example numbers, reasoner inferences"
        working-directory: ontology
        env:
          REQUIRE_REASONER: "1"
        run: python -m pytest -v
      - name: "ontology/: print quote breakdown"
        working-directory: ontology
        run: python scripts/quote.py
      - name: "agents: pytest"
        run: python -m pytest -v
      - name: CLI smoke run (RFQ-1002 with injected failure, fix, approve)
        env:
          PLA_AGENTS_DB: runs/ci.sqlite
        run: |
          python -m pla_agents run --rfq data/rfq-1002-incomplete.ttl --run-id ci --quote-date 2026-10-27 --base-delay 0
          python -m pla_agents run --resume ci --fix data/fixes/rfq-1002-fix.ttl --inject-failure match_library_part:1 --base-delay 0
          python -m pla_agents run --resume ci --approve --by ci
      - name: Upload ontology build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontology-build
          path: ontology/build/
